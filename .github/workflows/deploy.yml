# Production: push a v* tag, or run this workflow by hand.
# Staging: every push to master.
# D1 migrations run first. A failed migration fails the job, so the Worker
# is not deployed. Wrangler applies only migrations that are not already
# recorded, so a tag with no schema change is a no-op apply.
name: deploy

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production:
    name: production
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a7f63e2108d01fc6d8571772ac20f3e9' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # database_name school-organizer, binding D1_DATABASE (wrangler.jsonc
      # env.production). Pending SQL only; failure stops the deploy.
      - name: Apply pending production D1 migrations
        run: npx wrangler d1 migrations apply school-organizer --env production --remote

      - name: Build and deploy production
        run: npm run build && npx wrangler deploy --env production

  staging:
    name: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a7f63e2108d01fc6d8571772ac20f3e9' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # database_name school-organizer-staging, same binding D1_DATABASE.
      - name: Apply pending staging D1 migrations
        run: npx wrangler d1 migrations apply school-organizer-staging --env staging --remote

      - name: Build and deploy staging
        run: npm run build && npx wrangler deploy --env staging
